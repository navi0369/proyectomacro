# ══════════════════════════════════════════════════════════════════
# CONFIGURACIÓN GLOBAL PARA GRÁFICAS
# ══════════════════════════════════════════════════════════════════
plot_config:
  compatible_pairs:
    # Pares de tipos compatibles para dual-axis
    - ["percentage", "percentage"]  # Ambos porcentajes
    - ["index", "index"]            # Ambos índices
    - ["price", "price"]            # Ambos precios (misma moneda)
    
  currency_conversion:
    # Factores de conversión aproximados (actualizar según necesidad)
    "BOB_to_USD": 0.14  # 1 BOB = ~0.14 USD (ejemplo)
    "USD_to_BOB": 7.0   # 1 USD = ~7 BOB (ejemplo)
  
  normalization_options:
    - "raw"           # Sin normalización
    - "index_100"     # Índice base 100 (primer año)
    - "z_score"       # Estandarización
    - "percent_change" # Variación porcentual
  
  default_colors:
    primary: "#2E4B8A"
    secondary: "#8B0000"
    tertiary: "#228B22"
